apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo
  labels:
    app: sre-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-demo
  template:
    metadata:
      labels:
        app: sre-demo
    spec:
      containers:
        - name: sre-demo
          # Replace with your ECR URI and a real tag before first apply.
          image: YOUR_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/sre-cicd-demo:initial
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-demo
spec:
  type: ClusterIP
  selector:
    app: sre-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
